<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Rating</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <section class="rating-state" id="rating-state">
      <div class="star-icon" aria-hidden="true">
        <img src="images/icon-star.svg" alt="">
      </div>

      <h1>How did we do?</h1>
      <p>Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!</p>

      <form id="rating-form">
        <div class="rating-options">
          <label class="rating-btn">
            <input type="radio" name="rating" value="1" required>
            <span>1</span>
          </label>
          <label class="rating-btn">
            <input type="radio" name="rating" value="2">
            <span>2</span>
          </label>
          <label class="rating-btn">
            <input type="radio" name="rating" value="3">
            <span>3</span>
          </label>
          <label class="rating-btn">
            <input type="radio" name="rating" value="4">
            <span>4</span>
          </label>
          <label class="rating-btn">
            <input type="radio" name="rating" value="5">
            <span>5</span>
          </label>
        </div>

        <button type="submit" class="submit-btn">SUBMIT</button>
      </form>
    </section>

    <section class="thank-you-state hidden" id="thank-you-state">
      <div class="illustration">
        <img src="images/illustration-thank-you.svg" alt="">
      </div>

      <div class="selected-badge">
        You selected <span id="selected-rating">0</span> out of 5
      </div>

      <h2>Thank you!</h2>
      <p>We appreciate you taking the time to give a rating. If you ever need more support, don't hesitate to get in touch!</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
